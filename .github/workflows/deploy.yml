name: Deploy

# VPS deploy disabled — app.sip-protocol.org is served from Vercel as of 2026-06-01.
# The VPS containers on reclabs3 (sip-app-blue / sip-app-green) are intentionally
# kept running until the 7-day stability buffer elapses (~2026-06-08) as a
# rollback target. Re-enable by restoring the `push: branches: [main]` trigger
# below if a VPS-side rollback becomes necessary.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_RPC_URL=${{ secrets.NEXT_PUBLIC_RPC_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: sip
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/sip-app
            docker compose pull
            docker compose up -d --remove-orphans
            sleep 5
            curl -sf http://localhost:5005 > /dev/null || exit 1
            docker image prune -af --filter "until=24h"
            echo "Deploy successful"
